# Kuukan - a single-binary Jikan REST API v4 replacement.
#
#   docker compose up -d            # pulls ghcr.io/altqx/kuukan:${KUUKAN_TAG:-0.1.0}
#   docker compose up -d --build    # builds the image from this checkout instead
#   KUUKAN_TAG=edge docker compose up -d   # track the main branch image
#
# Optional: copy .env.example to .env to override defaults (rate limiting,
# cache TTLs, CORS, ...). The paths below always point inside the volume.
name: kuukan

services:
  kuukan:
    image: ghcr.io/altqx/kuukan:${KUUKAN_TAG:-0.1.0}
    build:
      context: .
    ports:
      - "${KUUKAN_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      KUUKAN_DB_PATH: /app/data/kuukan.db
      KUUKAN_SEARCH_PATH: /app/data/search
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - kuukan-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kuukan", "healthcheck", "--url", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kuukan-data: {}
