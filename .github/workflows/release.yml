name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Linux binary, attaches it (plus the compose file) to a GitHub
# release, and lets the Docker workflow publish the matching GHCR image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: Build Linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (Debian 12 baseline for a portable glibc)
        # Keep the image tag in sync with the Dockerfile build stage.
        run: |
          docker run --rm -v "$PWD:/src" -w /src rust:1.98-slim-bookworm bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends pkg-config libxml2-dev clang libclang-dev
            cargo build --release --locked --bin kuukan'

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="kuukan-${version}-x86_64-unknown-linux-gnu"
          stage="$(mktemp -d)"
          install -m 755 target/release/kuukan "${stage}/"
          cp README.md LICENSE NOTICE "${stage}/"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C "${stage}" .
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kuukan-release
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kuukan-release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          Kuukan ${GITHUB_REF_NAME} — a single self-contained Rust binary that serves
          the Jikan REST v4 surface under \`/v1\`.

          ### Container (linux/amd64, linux/arm64)

          \`\`\`bash
          docker pull ghcr.io/altqx/kuukan:${version}
          docker run -d -p 8080:8080 -v kuukan-data:/app/data ghcr.io/altqx/kuukan:${version}
          \`\`\`

          Or grab \`docker-compose.yml\` below: \`KUUKAN_TAG=${version} docker compose up -d\`.

          ### Binary

          \`kuukan-${version}-x86_64-unknown-linux-gnu.tar.gz\` contains the x86_64
          Linux binary (glibc >= 2.36, libxml2 required at runtime), README, LICENSE
          and NOTICE. Verify with the attached \`.sha256\`.

          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kuukan ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256 \
            docker-compose.yml .env.example
