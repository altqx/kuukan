[workspace]
resolver = "2"
members = [
    "crates/kuukan-core",
    "crates/kuukan-mal",
    "crates/kuukan-store",
    "crates/kuukan-search",
    "crates/kuukan-api",
    "crates/kuukan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kuukan contributors"]
repository = "https://github.com/altqx/kuukan"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
